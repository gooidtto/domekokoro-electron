name: Build Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - runtime-v2-kokoro-onnx-v11zh

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/kokoro-onnx/requirements.txt pyinstaller

      - name: Prepare packaged Kokoro runtime
        run: node scripts/prepare-distribution.js

      - name: Verify packaged assets
        shell: bash
        run: |
          test -s build/models/Kokoro-82M-v1.1-zh/int8/kokoro-v1.1-zh.int8.onnx
          test -s build/models/Kokoro-82M-v1.1-zh/int8/voices-v1.1-zh.bin

      - name: Build Electron package
        run: npm run pack

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: domekokoro-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
